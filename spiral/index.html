<style>
  :root{ --bg:#ffffff; --ink:#121211; --soft:#3b3934; --muted:#86827a; --line:rgba(18,18,17,.14); --hair:rgba(18,18,17,.08); --panel:rgba(255,255,255,.94);
    --ok:#3f8f5a; --warn:#c08a2a; --bad:#d2452f; --serif:"Instrument Serif","Times New Roman",serif; --sans:"Inter Tight",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:300 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block;outline:none}
  .mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
  button{font:400 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
  button:hover{border-color:var(--ink)}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button:disabled{opacity:.3;cursor:default}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:16px 18px;pointer-events:none;z-index:5}
  header h1{margin:0 8px 0 0;font:400 28px/1 var(--serif);letter-spacing:-.01em;pointer-events:auto;white-space:nowrap}
  header h1 i{font-style:italic}
  header .back{pointer-events:auto;color:var(--muted);text-decoration:none;font:300 20px var(--sans);padding:2px 6px 2px 0}
  header .back:hover{color:var(--ink)}
  header .sp{flex:1}
  header button{pointer-events:auto;padding:7px 9px;background:rgba(255,255,255,.8)}
  .seg{display:flex;pointer-events:auto;border:1px solid var(--line);border-radius:999px;padding:2px;background:rgba(255,255,255,.85)}
  .seg button{border:none;padding:5px 11px;font:400 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase}
  .seg button.on{background:var(--ink);color:#fff}
  .icon{width:17px;height:17px;display:block}
  #viewbar{position:fixed;left:18px;top:62px;z-index:5;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  #badge{font:400 10.5px/1.7 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);pointer-events:none}
  #badge b{color:var(--ink);font-weight:400}
  #badge .r{color:var(--bad)}
  #tools{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;z-index:6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #tools button{border:none;padding:8px 11px;display:flex;align-items:center;gap:6px}
  #tools button.on{background:var(--ink);color:#fff}
  #tools .lbl{font:400 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase}
  #tools .div{width:1px;background:var(--line);margin:6px 3px}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;font:400 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);pointer-events:none;transition:opacity .4s;z-index:4;white-space:nowrap}
  #panel{position:fixed;top:64px;right:18px;bottom:18px;width:332px;background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;z-index:7;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #tabs{display:flex;gap:0;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  #tabs button{border:none;border-radius:0;padding:13px 10px 11px;font:400 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap}
  #tabs button.on{background:none;color:var(--ink);border-bottom-color:var(--ink)}
  #body{flex:1;overflow-y:auto;padding:2px 18px 26px}
  .sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--hair)}
  .sec:first-child{border-top:none;padding-top:4px}
  .sec h3{margin:0 0 6px;font:400 21px/1.1 var(--serif)}
  .sec h3 small{font:400 10px var(--mono);color:var(--muted);margin-left:8px;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  .row{margin:10px 0}
  .row label{display:flex;justify-content:space-between;font:400 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .row label b{color:var(--ink);font-weight:400;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:20px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink);opacity:.9}
  input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-6px;border-radius:50%;background:#fff;border:1px solid var(--ink)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:1px solid var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
  .chips button{padding:5px 10px;font-size:12.5px}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .presets button{border-radius:3px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px}
  .presets button span{font:400 17px/1 var(--serif)}
  .presets button small{color:var(--muted);font:400 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase}
  .presets button.on small{color:rgba(255,255,255,.65)}
  .swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sw{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);padding:0;cursor:pointer}
  .sw.on{outline:1px solid var(--ink);outline-offset:2px}
  input[type=color]{width:24px;height:24px;border:none;padding:0;background:none;border-radius:50%;cursor:pointer}
  .toggle{display:flex;align-items:center;justify-content:space-between;margin:8px 0;font-size:13px}
  .toggle button{padding:4px 11px;font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
  .stack{display:flex;flex-direction:column;gap:6px}
  .stack button{border-radius:3px;text-align:left;padding:11px 13px}
  .stack button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  .note b{color:var(--ink);font-weight:500}
  .card{border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-top:8px}
  .chk{display:flex;gap:9px;font-size:12.5px;margin:6px 0;align-items:flex-start}
  .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font:400 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .stats b{display:block;color:var(--ink);font:400 15px var(--sans);letter-spacing:0;text-transform:none}
  textarea{width:100%;min-height:90px;background:#fafaf8;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px;font:11px/1.4 var(--mono)}
  #grab{display:none}
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:#fff;padding:7px 13px;border-radius:999px;font:400 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:30;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
  #busy.show{display:flex}
  @media (max-width:760px){
    #panel{top:auto;left:0;right:0;bottom:0;width:auto;border-radius:10px 10px 0 0;max-height:56vh;transform:translateY(100%);transition:transform .3s ease;padding-bottom:env(safe-area-inset-bottom)}
    #panel.open{transform:translateY(0)}
    #grab{display:block;width:36px;height:3px;border-radius:3px;background:var(--line);margin:8px auto 0;cursor:pointer}
    #tools{bottom:calc(14px + env(safe-area-inset-bottom))}
    #tools .lbl{display:none}
    #tools button{padding:9px 8px}
    body.panel-open #tools,body.panel-open #hint{opacity:0;pointer-events:none}
    header{padding:12px 12px} header h1{font-size:23px} header h1 .full{display:none}
    #viewbar{left:12px;top:54px}
  }
  @media (min-width:761px){ #editBtn{display:none} }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═════════════════════ constants & presets ═════════════════════ */
const N = 41;                 // profile samples per part (v: 0 bottom → 1 top)
const MW = 160, MH = 120;     // paint-mask resolution (θ × v); θ wraps → seamless
const COLLAR_H = .07, TAU = Math.PI * 2, MM = 100; // 1 scene unit = 100 mm
const prof = f => Array.from({length:N}, (_, i) => +f(i / (N - 1)).toFixed(4));
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const pat = (tex, amp, freq, layers, twist = 0) => ({ tex, amp, freq, layers, twist });
const NP0 = () => ({ mid:0, rim:0, waves:4, tilt:0 });
const MOD0 = () => ({ src:'none', target:'depth', lift:2, strength:.8, invert:false, radius:30, attrs:[], img:'', repeat:1, noise:3, seed:7 });
const part = (h, p, A, B, color, lobes = 0, lobeAmt = 0, np = {}, mod = {}) => ({ h, prof:p, ...A, b:B, mask:'', lobes, lobeAmt, color, np:{ ...NP0(), ...np }, mod:{ ...MOD0(), ...mod } });

const LAMP_PRESETS = {
  mushroom:{ name:'Mushroom', note:'Dome shade, fluted foot',
    shade:part(.72, prof(v => .26 + .76 * Math.pow(Math.cos(v * Math.PI / 2), .7)), pat('woven', .005, 40, 16), pat('ribs', .008, 60, 16), '#ece3d6'),
    base: part(1.0, prof(v => .2 + .29 * Math.pow(1 - v, 2.3)), pat('ribs', .012, 48, 20), pat('rings', .005, 40, 14), '#3b2622') },
  cone:{ name:'Cone', note:'Tapered shade, ribbed column',
    shade:part(.66, prof(v => .16 + .62 * (1 - v)), pat('rings', .005, 40, 16), pat('woven', .005, 40, 16), '#efe6d8'),
    base: part(.92, prof(v => .27 - .06 * v), pat('ribs', .01, 56, 20), pat('diamond', .005, 28, 14), '#ddd3c4') },
  saucer:{ name:'Saucer', note:'Wide disc, slim stem',
    shade:part(.5, prof(v => .26 + .7 * Math.pow(Math.sin(Math.min(1, (1 - v) * 1.25) * Math.PI / 2), .8) + .08 * Math.sin(v * Math.PI)), pat('woven', .005, 56, 12), pat('ribs', .008, 64, 12), '#e9dfd0'),
    base: part(1.08, prof(v => .17 + .2 * Math.pow(1 - v, 3)), pat('ribs', .01, 36, 20, .15), pat('rings', .005, 40, 16), '#2f2420') },
  hive:{ name:'Hive', note:'Coiled bell, petal foot',
    shade:part(.86, prof(v => .24 + .6 * Math.pow(Math.max(0, 1 - v * v), .6)), pat('rings', .007, 40, 14), pat('woven', .005, 40, 14), '#f0d9b5'),
    base: part(.86, prof(v => .2 + .14 * Math.cos(v * Math.PI) ** 2), pat('diamond', .005, 20, 12), pat('ribs', .01, 40, 12), '#5a3b2c', 6, .06) },
};
const VESSEL_PRESETS = {
  bud:{ name:'Bud vase', note:'Round belly, narrow neck',
    vessel:part(.95, prof(v => .12 + .25 * Math.exp(-(((v - .3) / .28) ** 2)) + .05 * smooth(.8, 1, v)), pat('woven', .005, 28, 16), pat('ribs', .008, 32, 16), '#e7d9c4') },
  tall:{ name:'Tall vase', note:'For dried stems',
    vessel:part(1.7, prof(v => .2 + .17 * Math.exp(-(((v - .35) / .32) ** 2)) - .03 * v + .05 * smooth(.85, 1, v)), pat('ribs', .01, 48, 30, .25), pat('woven', .006, 36, 30), '#d8c7b0') },
  bowl:{ name:'Bowl', note:'Open, gently flared',
    vessel:part(.66, prof(v => .38 + .4 * Math.sin(v * Math.PI / 2)), pat('woven', .005, 56, 14), pat('rings', .006, 40, 12), '#efe6d8') },
  tide:{ name:'Tide vase', note:'Non-planar wavy layers',
    vessel:part(1.2, prof(v => .27 + .06 * Math.sin(v * Math.PI) - .03 * v), pat('smooth', 0, 40, 20), pat('rings', .005, 40, 20), '#d9cbb6', 0, 0, { mid:5, waves:2 }) },
  crown:{ name:'Crown bowl', note:'Wavy rim, noise texture',
    vessel:part(.7, prof(v => .36 + .36 * Math.sin(v * Math.PI / 2)), pat('ribs', .006, 48, 20), pat('woven', .005, 40, 14), '#efe2cf', 0, 0, { rim:4, waves:5 }, { src:'noise', target:'depth', strength:.7, noise:3 }) },
  pot:{ name:'Petal pot', note:'Lobed tumbler',
    vessel:part(.95, prof(v => .33 - .05 * v + .02 * smooth(.9, 1, v)), pat('ribs', .01, 56, 20), pat('diamond', .005, 28, 16), '#b88a6a', 8, .05) },
};
// keep every preset inside a printable overhang for vase mode
function easeSlope(P, deg = 45) {
  const maxD = Math.tan(deg * Math.PI / 180) * (P.h / (N - 1)), pr = P.prof; let iMax = 0; pr.forEach((r, i) => { if (r > pr[iMax]) iMax = i; });
  for (let i = iMax + 1; i < N; i++) pr[i] = +Math.min(Math.max(pr[i], pr[i - 1] - maxD), pr[i - 1] + maxD).toFixed(4);
  for (let i = iMax - 1; i >= 0; i--) pr[i] = +Math.min(Math.max(pr[i], pr[i + 1] - maxD), pr[i + 1] + maxD).toFixed(4);
}
for (const p of [...Object.values(LAMP_PRESETS), ...Object.values(VESSEL_PRESETS)]) for (const k of ['shade', 'base', 'vessel']) if (p[k]) easeSlope(p[k]);

const PRINTERS = {
  a1mini:{ name:'A1 mini', bed:[180,180], maxZ:180, park:[10,170], purgeY:4 },
  a1:{ name:'A1', bed:[256,256], maxZ:256, park:[10,250], purgeY:4 },
  p1s:{ name:'P1S / P1P', bed:[256,256], maxZ:250, park:[65,245], purgeY:4 },
  x1c:{ name:'X1C / X1E', bed:[256,256], maxZ:250, park:[65,245], purgeY:4 },
  p2s:{ name:'P2S', bed:[256,256], maxZ:256, park:[65,245], purgeY:4 },
  a2l:{ name:'A2L', bed:[330,320], maxZ:325, park:[10,310], purgeY:4 },
};
const FILAMENTS = {
  pla:{ name:'PLA', nozzle:220, bed:55, fan:100, flow:18 },
  matte:{ name:'PLA Matte', nozzle:220, bed:55, fan:100, flow:16 },
  silk:{ name:'Silk PLA', nozzle:225, bed:55, fan:100, flow:12 },
  petg:{ name:'PETG', nozzle:250, bed:70, fan:40, flow:12 },
};
const NOZZLES = [.4, .6, .8];
const lineW = n => +(n * 1.12).toFixed(2);

const clone = o => JSON.parse(JSON.stringify(o));

  files.push({ name:'design.json', data:enc.encode(JSON.stringify(state)) }, { name:'README.txt', data:readme() });
  await saveFile('spiral-export.zip', zip(files));
}
// Inside Claude the page can only offer certain file types, so G-code is wrapped in a .zip there.
async function saveFile(name, blob, wrapIfNeeded = false) {
  try {
    if (window.claude?.use) {
      const dl = await window.claude.use('downloads');
      if (dl) {
        let fname = name, data = blob;
        if (wrapIfNeeded && !/\.(zip|json|txt)$/i.test(name)) { fname = name.replace(/\.[^.]+$/, '') + '.zip'; data = zip([{ name, data:new Uint8Array(await blob.arrayBuffer()) }]); }
        try { await dl.save({ filename:fname, data }); toast('Saved ' + fname); } catch (e) { toast(e?.code === 'declined' ? 'Download cancelled' : 'Download unavailable here'); }
        return;
      }
    }
  } catch (e) {}
  const a = el('a', { href:URL.createObjectURL(blob), download:name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Downloaded ' + name);
}
