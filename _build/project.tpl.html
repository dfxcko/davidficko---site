<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
<meta charset="utf-8">
<script>(function(h){try{h.dataset.theme=localStorage.getItem('df-theme')||'light';var l=localStorage.getItem('df-lang');h.lang=(l==='sl'||l==='en')?l:((navigator.language||'').toLowerCase().indexOf('sl')===0?'sl':'en')}catch(e){}})(document.documentElement)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — David Ficko</title>
<meta name="description" content="{{DESC}}">
<meta property="og:title" content="{{TITLE}} — David Ficko">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{COVER}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/project.css">
</head>
<body>
<div class="curtain" id="curtain"></div>
<div class="grain" id="grain"></div>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="ring"><span>+</span></div>

<header>
  <a href="/" class="logo">D<em>F</em></a>
  <nav class="mono">
    <a href="/#index"><span data-t="work">Work</span><span data-t="work">Work</span></a>
    <a href="/#contact"><span data-t="contact">Contact</span><span data-t="contact">Contact</span></a>
    <button class="lang" id="lang" aria-label="Language"><b data-l="en">EN</b><i>/</i><b data-l="sl">SL</b></button>
    <button class="theme" id="theme" aria-label="Light / dark"></button>
  </nav>
</header>

<main>
  <section class="p-hero">
    <a class="p-back mono" href="/#index"><i></i><span data-t="back">All work</span></a>
    <h1 class="p-title">{{TITLE}}</h1>
    <div class="p-meta mono">
      <span><span class="muted" data-t="no">No.</span>{{NO}} / {{TOTAL}}</span>
      <span>{{YEAR}}</span>
    </div>
  </section>

  <div class="p-cover"><img {{COVER_ATTRS}} alt="{{TITLE}}" fetchpriority="high"></div>

  <section class="p-intro">
    <div class="p-facts mono">
      <div><span class="muted" data-t="year">Year</span><span>{{YEAR}}</span></div>
      <div><span class="muted" data-t="no">No.</span><span>{{NO}}</span></div>
      <div><span class="muted" data-t="images">Images</span><span>{{COUNT}}</span></div>
    </div>
    <div class="p-text">
{{TEXT}}
    </div>
  </section>

  <section class="p-gallery">
{{GALLERY}}
  </section>

  <a class="p-next" href="/{{NEXT_SLUG}}/">
    <div class="bg"><img {{NEXT_COVER_ATTRS}} alt="" loading="lazy"></div>
    <span class="mono muted" data-t="next">Next project</span>
    <div class="t">{{NEXT_NAME}} <em>→</em></div>
  </a>
  <footer class="mono">
    <span class="muted">© 2026 David Ficko</span>
    <a href="#top" data-top>↑</a>
  </footer>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" id="lbX" data-t="close">Close</button>
  <img alt="">
  <div class="bar mono">
    <span id="lbN">01 / 01</span>
    <div class="nav"><button id="lbP" data-t="prev">Prev</button><button id="lbF" data-t="nxt">Next</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="/assets/project.js"></script>
</body>
</html>
