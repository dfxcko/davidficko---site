<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David Ficko — Architecture</title>
<meta name="description" content="David Ficko — architecture. Selected projects 2020–2026.">
<script>try{localStorage.removeItem('df-theme');document.documentElement.dataset.theme=sessionStorage.getItem('df-theme')||'light'}catch(e){}</script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0b0a; --ink2:#141413; --bone:#ece8e0; --mute:#7d796f; --line:rgba(236,232,224,.13); --soft:#c9c5bc;
  --serif:"Instrument Serif","Times New Roman",serif;
  --sans:"Inter Tight",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(20px,3.2vw,48px);
  --ease:cubic-bezier(.7,0,.2,1);
  --out:cubic-bezier(.16,1,.3,1);
}
[data-theme=light]{--ink:#ffffff; --ink2:#ffffff; --bone:#121211; --mute:#86827a; --line:rgba(18,18,17,.14); --soft:#3b3934}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);color:var(--bone);-webkit-font-smoothing:antialiased;transition:background .6s,color .6s}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.5;overflow-x:hidden}
body.loading{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
::selection{background:var(--bone);color:var(--ink)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--mute)}
@media (pointer:fine){body,a,button{cursor:none}}

.grain{position:fixed;inset:-50%;pointer-events:none;z-index:90;opacity:.07;animation:grain 1s steps(6) infinite}
[data-theme=light] .grain{opacity:.05;mix-blend-mode:multiply}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-2%,6%)}80%{transform:translate(5%,1%)}100%{transform:translate(0,0)}}

/* cursor (white + difference = always contrasting) */
.cursor,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:100;border-radius:50%;mix-blend-mode:difference}
.cursor{width:6px;height:6px;background:#fff;margin:-3px 0 0 -3px}
.cursor-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1px solid rgba(255,255,255,.6);display:grid;place-items:center;transition:width .5s var(--ease),height .5s var(--ease),margin .5s var(--ease),background .4s}
.cursor-ring span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#000;opacity:0;transition:opacity .3s}
.cursor-ring.big{width:86px;height:86px;margin:-43px 0 0 -43px;background:#fff}
.cursor-ring.big span{opacity:1}
.cursor-ring.link{width:60px;height:60px;margin:-30px 0 0 -30px}
.cursor-ring.drag{width:64px;height:64px;margin:-32px 0 0 -32px}
@media (pointer:coarse){.cursor,.cursor-ring{display:none}}

/* loader + curtain */
.loader{position:fixed;inset:0;z-index:95;pointer-events:none}
.loader .panel{position:absolute;left:0;right:0;height:50.5%;background:var(--ink2);transition:transform 1.2s var(--ease)}
.loader .panel.t{top:0}.loader .panel.b{bottom:0}
.loader.open .panel.t{transform:translateY(-100%)}.loader.open .panel.b{transform:translateY(100%)}
.loader .inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;transition:opacity .4s,transform .4s}
.loader.open .inner{opacity:0;transform:translateY(-20px)}
.loader .count{font-family:var(--serif);font-size:clamp(64px,9vw,128px);line-height:1;font-variant-numeric:tabular-nums}
.loader .bar{width:min(320px,60vw);height:1px;background:var(--line);overflow:hidden}
.loader .bar i{display:block;height:100%;background:var(--bone);transform:scaleX(0);transform-origin:left}
.curtain{position:fixed;inset:0;background:var(--ink2);z-index:96;transform:translateY(100%);pointer-events:none}
.curtain.go{transform:translateY(0);transition:transform .75s var(--ease)}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;justify-content:flex-end;align-items:center;padding:22px var(--pad);mix-blend-mode:difference;color:#fff;transition:opacity .8s}
body.loading header,body.loading .logo{opacity:0}
.logo{position:fixed;top:22px;left:var(--pad);z-index:81;font-family:var(--serif);font-size:26px;line-height:1;letter-spacing:-.02em;color:var(--bone);transition:opacity .25s,color .5s}
.logo em{font-style:italic}
.logo.gold{color:#F5C400}
.logo.hide{opacity:0}
@media (pointer:coarse){.logo{top:10px;padding:10px 0}}
header nav{display:flex;gap:28px;align-items:center}
header nav a{position:relative;overflow:hidden;display:inline-block;height:14px}
header nav a span{display:block;transition:transform .6s var(--ease)}
header nav a span+span{position:absolute;top:100%;left:0}
header nav a:hover span{transform:translateY(-100%)}
.tog{background:none;border:0;display:flex;gap:4px;align-items:center;height:14px;line-height:14px}
.tog b{font-weight:400;opacity:.45;transition:opacity .4s}.tog b.on{opacity:1}.tog i{font-style:normal;opacity:.45}
.theme{background:none;border:0;width:24px;height:24px;display:grid;place-items:center;color:inherit;padding:0}
.theme i{display:block;width:14px;height:14px;border-radius:50%;border:1px solid currentColor;position:relative;overflow:hidden}
.theme i::after{content:"";position:absolute;inset:0;background:currentColor;transform:translateX(50%);transition:transform .6s var(--ease)}
[data-theme=light] .theme i::after{transform:translateX(-50%)}
/* touch screens: bigger tap areas in the menu, no hover roll */
@media (pointer:coarse){
  header{padding-top:10px;padding-bottom:10px}
  header nav{gap:6px}
  header nav a{height:auto;overflow:visible;padding:15px 8px}
  header nav a span+span{display:none}
  .tog{height:auto;padding:15px 8px}
  .theme{width:44px;height:44px}
  .logo{padding:10px 0}
}
@media(max-width:720px){header nav{gap:16px}}
[data-t]{transition:opacity .35s}.swap [data-t]{opacity:0}
@media (max-width:440px){.nav-work{display:none!important} header nav{gap:2px} header nav a,.tog{padding-left:6px;padding-right:6px} .theme{width:40px}}


/* ===== ring interface ===== */
.ring-sec{position:relative}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;touch-action:pan-y;background:var(--ink);transition:background .6s}
.scene{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 30%}
.world{position:absolute;left:50%;top:53%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.floor{position:absolute;transform-style:preserve-3d}
.floor svg{display:block;overflow:visible}
.floor svg *{fill:none;stroke:var(--bone)}
.plate{position:absolute;transform-style:preserve-3d;transition:opacity 1s,filter .6s}
.plate .lift{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s var(--out)}
.plate.on .lift{transform:translateZ(var(--pop)) translateY(calc(var(--h) * -.42)) scale(1.55)}
.plate .face,.plate .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.plate .face{background:var(--ink2);overflow:hidden;outline:1px solid var(--line)}
[data-theme=light] .plate .face{outline:0}
.plate .face img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05);transition:filter .8s}
.plate .back{transform:rotateY(180deg);background:var(--ink);outline:1px solid var(--line);display:flex;align-items:flex-end;padding:8px}
.plate .post{position:absolute;left:50%;top:100%;width:1px;background:var(--bone);opacity:.35;transform-origin:top}
.plate.on .face img,.plate:hover .face img{filter:none}
.plate .face::after{content:attr(data-n);position:absolute;left:6px;top:5px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:#fff;mix-blend-mode:difference}
.world.pre .plate{opacity:0}
.hello{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);text-align:center;pointer-events:none;z-index:3;color:#F5C400}
.hello h1{font-family:var(--serif);font-weight:400;font-size:clamp(80px,16vw,250px);line-height:.84;letter-spacing:-.035em}
.hello h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
.hello h1 .ln:nth-child(2){font-style:italic}
.char{display:inline-block;will-change:transform;transition:transform 1.3s var(--out)}
.pre-chars .char{transform:translateY(115%)}
.cue{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .5s}
.cue i{width:1px;height:46px;background:var(--line);position:relative;overflow:hidden}
.cue i::after{content:"";position:absolute;inset:0;background:var(--bone);animation:drop 2.2s var(--ease) infinite}
@keyframes drop{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}

.info{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(24px,5vh,48px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;pointer-events:none;transition:opacity .6s, transform .8s var(--out)}
.info.off{opacity:0;transform:translateY(30px)}
.ptitle{position:relative;height:1.3em;overflow:hidden;font-family:var(--serif);font-size:clamp(56px,8.4vw,132px);line-height:1;letter-spacing:-.03em;min-width:50vw}
.ptitle .strip,.roll .strip{display:block;will-change:transform}
.ptitle .strip span{display:block;height:1.3em;line-height:1.15em;white-space:nowrap}
.roll{display:inline-block;height:1.5em;overflow:hidden;vertical-align:bottom}
.roll .strip span{display:block;height:1.5em;line-height:1.5em}
.pmeta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right;pointer-events:auto}
.pmeta .open{display:inline-flex;align-items:center;gap:10px;margin-top:6px;border:1px solid var(--bone);border-radius:99px;padding:9px 16px;transition:background .4s,color .4s}
.pmeta .open:hover{background:var(--bone);color:var(--ink)}
.pno{font-variant-numeric:tabular-nums}
.rail{position:absolute;right:var(--pad);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;transition:opacity .6s}
.rail.off{opacity:0;pointer-events:none}
.rail button{background:none;border:0;height:7px;display:flex;align-items:center;justify-content:flex-end;padding:0}
.rail button i{display:block;width:14px;height:1px;background:var(--bone);opacity:.3;transition:width .6s var(--out),opacity .4s}
.rail button.on i{width:34px;opacity:1}
.rail button:hover i{opacity:.8;width:24px}
.arrows{position:absolute;left:var(--pad);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;transition:opacity .6s}
.arrows.off{opacity:0;pointer-events:none}
.arrows button{background:none;border:1px solid var(--line);width:40px;height:40px;border-radius:50%;transition:border-color .3s,background .3s,color .3s}
.arrows button:hover{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.down{position:absolute;left:50%;bottom:clamp(24px,5vh,48px);transform:translateX(-50%);width:40px;height:40px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:opacity .6s,background .3s,color .3s,border-color .3s}
.down:hover{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.down.off{opacity:0;pointer-events:none}
@media(max-width:720px){.down{display:none}}
.swipe{display:none}
body.touch .cue{display:none}
body.touch .hello{top:17%;transform:none}
body.touch .hello h1{font-size:min(22vw,120px)}
body.touch .swipe{display:flex;position:absolute;left:0;right:0;top:calc(47% + var(--hint,90px));justify-content:center;gap:10px;opacity:.5;pointer-events:none;transition:opacity .6s}
body.touch .swipe.gone{opacity:0}
@media(max-width:720px){.world{top:52%}.rail{display:none}.arrows{top:auto;left:auto;right:var(--pad);bottom:clamp(24px,5vh,48px);transform:none;flex-direction:row}.ptitle{min-width:0;width:100%;font-size:clamp(44px,12vw,72px)}.info{flex-direction:column;align-items:flex-start}.pmeta{align-items:flex-start;text-align:left}}

/* ===== index list ===== */
.index{padding:clamp(80px,9vw,140px) 0 clamp(80px,10vw,140px);border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);margin-bottom:28px}
.rows{border-top:1px solid var(--line);margin:0 var(--pad)}
.row{position:relative;display:grid;grid-template-columns:70px 1fr 120px 40px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);overflow:hidden;isolation:isolate;transition:opacity .4s,color .4s}
.row::before{content:"";position:absolute;inset:0;background:var(--bone);transform:scaleY(0);transform-origin:bottom;transition:transform .6s var(--ease);z-index:-1}
.row .nm{font-family:var(--serif);font-size:clamp(26px,3.4vw,48px);line-height:1;letter-spacing:-.01em;transition:transform .6s var(--ease)}
.row .yr{text-align:right}
.row .ar{text-align:right;font-size:18px;transition:transform .6s var(--ease)}
.row:hover{color:var(--ink)}
.row:hover::before{transform:scaleY(1)}
.row:hover .nm{transform:translateX(18px)}
.row:hover .ar{transform:rotate(45deg)}
.row:hover .muted{color:inherit;opacity:.6}
.rows.dim .row:not(:hover){opacity:.4}
.row .th{display:none}
@media (pointer:coarse){.row .th{display:inline-block;width:64px;height:50px;object-fit:cover;vertical-align:middle;margin-right:16px;filter:grayscale(1)}}
.row.hide{display:none}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{background:none;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;transition:background .3s,color .3s}
.filters button.on,.filters button:hover{background:var(--bone);color:var(--ink)}
@media(max-width:720px){.row{grid-template-columns:36px 1fr 48px 20px;padding:16px 0}.row .nm{font-size:30px}.sec-head{flex-direction:column;align-items:stretch;gap:14px}.filters{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1*var(--pad));padding:0 var(--pad);scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button{flex:none;padding:10px 15px}.index{padding-top:56px}}
.preview{position:fixed;top:0;left:0;width:340px;height:255px;z-index:70;pointer-events:none;overflow:hidden;opacity:0;transform:scale(.85);transition:opacity .35s,transform .5s var(--ease);background:var(--ink2)}
.preview.on{opacity:1;transform:scale(1)}
.preview .pv-img{position:absolute;inset:0;clip-path:inset(100% 0 0 0);transition:clip-path .8s var(--ease)}
.preview .pv-img.in{clip-path:inset(0 0 0 0)}
.preview img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.15);transition:transform 1.4s var(--ease)}
.preview .pv-img.in img{transform:scale(1)}
@media (pointer:coarse){.preview{display:none}}

/* ===== contact ===== */
.contact{min-height:80svh;padding:clamp(100px,12vw,180px) var(--pad) 40px;display:flex;flex-direction:column;justify-content:space-between;border-top:1px solid var(--line)}
.contact-row{display:flex;justify-content:center}
.magnet{width:clamp(150px,16vw,210px);aspect-ratio:1;border-radius:50%;border:1px solid var(--bone);display:grid;place-items:center;background:none;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;position:relative;overflow:hidden;isolation:isolate;transition:color .4s}
.magnet::before{content:"";position:absolute;inset:0;background:var(--bone);border-radius:50%;transform:scale(0);transition:transform .6s var(--ease);z-index:-1}
.magnet:hover{color:var(--ink)}.magnet:hover::before{transform:scale(1)}
.magnet span{pointer-events:none}
form.inq{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;max-width:760px;margin:0 auto;overflow:hidden;max-height:0;opacity:0;transition:max-height 1s var(--ease),opacity .6s,margin .6s}
form.inq.open{max-height:520px;opacity:1;margin-top:48px}
form.inq label{display:flex;flex-direction:column;gap:8px;padding:18px 0;border-bottom:1px solid var(--line)}
form.inq label.full{grid-column:1/-1}
form.inq input,form.inq textarea{background:none;border:0;outline:0;color:var(--bone);font:inherit;font-size:18px;font-family:var(--serif);resize:none}
form.inq button{grid-column:1/-1;justify-self:start;margin-top:28px;background:var(--bone);color:var(--ink);border:0;border-radius:99px;padding:14px 26px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.thanks{font-family:var(--serif);font-size:32px;font-style:italic;display:none;margin-top:40px;text-align:center}
footer{display:flex;justify-content:space-between;padding-top:80px}
@media(max-width:720px){form.inq{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.grain,.cue i::after{animation:none}}
</style>
</head>
<body class="loading">
<div class="curtain" id="curtain"></div>
<div class="grain" id="grain"></div>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="ring"><span id="ringTxt">OPEN</span></div>

<div class="loader" id="loader">
  <div class="panel t"></div><div class="panel b"></div>
  <div class="inner"><div class="count" id="count">000</div><div class="bar"><i id="bar"></i></div></div>
</div>

<a href="#top" class="logo" id="logo" data-scroll="#top" aria-label="David Ficko"><span class="lg-d">D</span><em class="lg-f">F</em></a>
<header>
  <nav class="mono">
    <a class="nav-work" href="#top" data-scroll="#top"><span data-t="work">Work</span><span data-t="work">Work</span></a>
    <a href="#index" data-scroll="#index"><span data-t="index">Index</span><span data-t="index">Index</span></a>
    <a href="#contact" data-scroll="#contact"><span data-t="contact">Contact</span><span data-t="contact">Contact</span></a>
    <button class="tog" id="lang" aria-label="Language"><b data-l="en">EN</b><i>/</i><b data-l="sl">SL</b></button>

</header>

<main id="top">
  <section class="ring-sec" id="ringSec">

      <div class="scene"><div class="world pre" id="world"><div class="floor" id="floor"></div></div></div>

    </footer>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(pointer: fine)').matches;
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- data (kept in sync by _build/build.py) ---------- */
const IMG='';
const PROJECTS = [
  ["Mura", 2026, "mura", "/images/mura/cover-640.webp", "/images/mura/cover-1280.webp"],
  ["Light", 2026, "light", "/images/light/cover-640.webp", "/images/light/cover-1280.webp"],

const world=$('#world'), floor=$('#floor'), stage=$('#stage'), sec=$('#ringSec'), curtainEl=$('#curtain');

const STEP_DEG=360/N;
let W=160,H=120,R=600, plates=[];
function layout(){
  const vw=innerWidth, vh=innerHeight, mob=vw<720;
  W=mob? vw*.24 : clamp(vw*.105,110,200); H=W*.78;
  R=N*W*1.32/(2*Math.PI);
  world.style.setProperty('--pop', (W*.9)+'px'); world.style.setProperty('--h', H+'px');
  plates.forEach((p,i)=>{ p.style.width=W+'px'; p.style.height=H+'px'; p.style.left=(-W/2)+'px'; p.style.top=(-H)+'px';
    p.style.transform=`rotateY(${i*STEP_DEG}deg) translateZ(${R}px)`;
    p.querySelector('.post').style.height=(H*.0)+'px'; });
  drawFloor();
  sec.style.height=vh+'px';
  stage.style.setProperty('--hint', (H*1.2)+'px');
}
function drawFloor(){
  const S=R*2.9, c=S/2, NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('width',S); svg.setAttribute('height',S); svg.setAttribute('viewBox',`0 0 ${S} ${S}`);
  const add=(t,a,op=.35)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); e.setAttribute('stroke-opacity',op); e.setAttribute('stroke-width',1); svg.appendChild(e); return e; };
  add('circle',{cx:c,cy:c,r:R},.55);
  add('circle',{cx:c,cy:c,r:R*1.06},.25);
  add('circle',{cx:c,cy:c,r:R*1.32,'stroke-dasharray':'2 10'},.3);
  for(let k=0;k<7;k++){ const r=R*(.56+k*.055), a0=Math.PI*.15, a1=Math.PI*.85;
    add('path',{d:`M${c+Math.cos(a0)*r} ${c+Math.sin(a0)*r} A ${r} ${r} 0 0 1 ${c+Math.cos(a1)*r} ${c+Math.sin(a1)*r}`},.3); }
  const oct=[]; for(let i=0;i<8;i++){ const a=Math.PI/8+i*Math.PI/4; oct.push((c+Math.cos(a)*R*.34)+' '+(c+Math.sin(a)*R*.34)); }
  add('path',{d:'M'+oct.join(' L')+' Z'},.6);
  add('circle',{cx:c,cy:c,r:R*.14},.45);
  for(let i=0;i<N;i++){ const a=i*STEP_DEG*Math.PI/180; // radial line under each plate (front = +z = down in plan)
    const x=Math.sin(a), y=Math.cos(a);
    add('line',{x1:c+x*R*.4,y1:c+y*R*.4,x2:c+x*R*1.32,y2:c+y*R*1.32},.16); }
  add('line',{x1:c,y1:c-R*1.5,x2:c,y2:c+R*1.5,'stroke-dasharray':'2 8'},.25);
  add('line',{x1:c-R*1.5,y1:c,x2:c+R*1.5,y2:c,'stroke-dasharray':'2 8'},.25);
  floor.innerHTML=''; floor.appendChild(svg);
  floor.style.left=(-c)+'px'; floor.style.top=(-c)+'px'; floor.style.width=S+'px'; floor.style.height=S+'px';
  floor.style.transform='rotateX(90deg)';
}

/* =========================================================
   INFINITE RING — one screen; wheel / drag / swipe turn it, it never ends
   ========================================================= */
const mod=(a,n)=>((a%n)+n)%n;
let rot=0, rotV=0, tRot=0, active=-1, inIntro=true, drift=0, dragging=false;
let started=false, base=0, off=0, offMode='wheel', lastWheel=0, overPlate=false, driftV=.035, scrollVel=0;
const resist=x=>{ const a=Math.abs(x); return Math.sign(x)*(a<1?Math.pow(a,1.6):1+(a-1)); };
function begin(){ if(started) return; started=true; base=Math.round(-rot/STEP_DEG); off=0; flyName(); $('#swipe').classList.add('gone'); }
function settle(){ if(!off) return; const n = offMode==='wheel' ? Math.sign(off)*Math.floor(Math.abs(off)+.15) : Math.round(off); base+=n; off=0; }
function goStep(d){ begin(); settle(); base+=d; }
function goTo(i){ begin(); settle(); const cur=mod(base,N); let d=mod(i-cur,N); if(d>N/2) d-=N; base+=d; }

function setActive(i){
  if(i===active) return; active=i;
  plates.forEach((p,j)=>p.classList.toggle('on',j===i));
  $$('#rail button').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('#popen').href=`/${PROJECTS[i][2]}/`;
}
function setIntro(v){
  if(v===inIntro) return; inIntro=v;
  $('#cue').style.opacity=v?1:0;
  ['#info','#rail','#arrows','#down'].forEach(s=>$(s)&&$(s).classList.toggle('off',v));
}
let tilt=-12, tTilt=-12, mx=0, tmx=0;
addEventListener('pointermove',e=>{ tmx=(e.clientX/innerWidth-.5); });
function frame(t){
  requestAnimationFrame(frame);
  const intro=!started;
  setIntro(intro);
  driftV+=((overPlate||RM?0:.035)-driftV)*.08;
  if(intro){ drift+=driftV; tRot=-drift; tTilt=-22; }
  else {
    const v=base+(offMode==='wheel'?resist(off):off);
    tRot=-v*STEP_DEG; tTilt=-12; setActive(mod(Math.round(v),N));
    // wheel paused (or mouse resting on a project): finish on a project
    if(off && offMode==='wheel' && performance.now()-lastWheel>380) settle();
  }
  if(RM){ rot=tRot; rotV=0; }
  else if(intro){ rot+=(tRot-rot)*.09; rotV=0; }
  else { rotV+=(tRot-rot)*.035; rotV*=.8; rot+=rotV; }      // soft spring: glides, overshoots a hair, settles
  tilt+=(tTilt-tilt)*.05; mx+=(tmx-mx)*.05;
  world.style.transform=`translateZ(-${R*.55}px) rotateX(${tilt}deg) rotateY(${rot + mx*8}deg)`;
  // name, number and year ride on the same angle as the ring (the strips repeat the first item, so the loop is seamless)
  if(!intro){ const fr=mod(-rot/STEP_DEG,N);
    tStrip.style.transform=`translate3d(0,${-fr*tLine}px,0)`; nStrip.style.transform=`translate3d(0,${-fr*nLine}px,0)`; yStrip.style.transform=`translate3d(0,${-fr*nLine}px,0)`; }
}

/* mouse wheel / trackpad: only while the ring fills the screen; further down the page scrolls normally */
const ringOwnsWheel=()=>scrollY<=4 && !RM;
addEventListener('wheel',e=>{
  if(!ringOwnsWheel()) return;
  if(e.target.closest && !e.target.closest('#stage')) return;
  e.preventDefault();
  const px=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*(e.deltaMode===1?33:e.deltaMode===2?innerHeight:1);
  begin(); if(offMode!=='wheel'){ settle(); offMode='wheel'; }
  off+=px/500;                       // about 5 wheel notches per project
  lastWheel=performance.now();
},{passive:false});

/* hovering: the idle spin eases out; resting on the left/right neighbour turns to it */
world.addEventListener('pointerover',e=>{ if(e.pointerType!=='mouse'||!e.target.closest('.plate')) return; overPlate=true; armHover(+e.target.closest('.plate').dataset.i); });
world.addEventListener('pointerout',e=>{ const to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.plate'); if(!to){ overPlate=false; hoverIdx=-1; clearTimeout(hoverTimer); } });
let hoverTimer=0, hoverIdx=-1, hoverReady=true, hx=0, hy=0, cxLast=0, cyLast=0;
addEventListener('pointermove',e=>{ cxLast=e.clientX; cyLast=e.clientY; if(!hoverReady && Math.hypot(e.clientX-hx,e.clientY-hy)>6) hoverReady=true; },{passive:true});
const sideOf=i=>{ const d=mod(i-active,N); return d===1?1:d===N-1?-1:0; };
function armHover(i){
  clearTimeout(hoverTimer); hoverIdx=i;
  if(TOUCH || inIntro || dragging || !hoverReady || active<0 || !sideOf(i)) return;
  hoverTimer=setTimeout(()=>{ const s=sideOf(i); if(hoverIdx!==i || !s || Math.abs(rotV)>.15) return;
    hoverReady=false; hx=cxLast; hy=cyLast; goStep(s); },260);
}

/* touch: horizontal swipe turns the ring; vertical movement scrolls the page */
let tx0=0, ty0=0, tracking=false, horiz=null, tapX=0, tapY=0, moved2=0;
stage.addEventListener('touchstart',e=>{ if(!TOUCH) return; const t=e.touches[0]; tx0=tapX=t.clientX; ty0=tapY=t.clientY; tracking=true; horiz=null; moved2=0; },{passive:true});
stage.addEventListener('touchmove',e=>{ if(!tracking) return; const t=e.touches[0], dx=t.clientX-tx0, dy=t.clientY-ty0;
  moved2=Math.max(moved2,Math.abs(dx),Math.abs(dy));
  if(horiz===null && (Math.abs(dx)>8||Math.abs(dy)>8)){ horiz=Math.abs(dx)>Math.abs(dy); if(horiz){ begin(); settle(); offMode='drag'; } }
  if(horiz){ if(e.cancelable) e.preventDefault(); off=-dx/(W*.9); } },{passive:false});

  if(horiz){ settle(); return; }
  if(moved2<10 && !e.target.closest('a,button')){ const i=plateAt(tapX,tapY); if(i>=0){ if(e.cancelable) e.preventDefault(); begin(); if(i===active) openProject(i); else goTo(i); } } });
/* which project was tapped: 3D hit-testing first, then the on-screen box of each visible plate (front ones win) */
function plateAt(x,y){
  const hit=document.elementFromPoint(x,y)?.closest('.plate'); if(hit) return +hit.dataset.i;
  let best=-1, bz=-1e9;
  plates.forEach((p,i)=>{ const r=p.querySelector('.face').getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){ const z=i===active?1e6:r.width*r.height; if(z>bz){ bz=z; best=i; } } });
  return best;

  curtainEl.className='curtain'; void curtainEl.offsetWidth; curtainEl.classList.add('go'); setTimeout(()=>location.href=a.href,700); });

const mg=$('#magnet');
if(FINE){ mg.addEventListener('pointermove',e=>{ const b=mg.getBoundingClientRect(); const x=e.clientX-b.left-b.width/2, y=e.clientY-b.top-b.height/2; mg.style.transform=`translate(${x*.3}px,${y*.3}px)`; });
  mg.addEventListener('pointerleave',()=>{ mg.style.transition='transform .7s cubic-bezier(.2,1.4,.4,1),color .4s'; mg.style.transform=''; setTimeout(()=>mg.style.transition='',700); }); }
mg.addEventListener('click',()=>{ $('#inq').classList.add('open'); setTimeout(()=>$('#inq input').focus({preventScroll:true}),400); });
$('#inq').addEventListener('submit',e=>{ e.preventDefault(); $('#inq').classList.remove('open'); $('#thanks').style.display='block'; });

/* ---------- smooth scroll ---------- */
let lenis=null;
if(!RM && typeof Lenis!=='undefined'){ lenis=new Lenis({lerp:.07, wheelMultiplier:1, smoothWheel:true, prevent:node=>scrollY<=4 && !!(node.closest&&node.closest('#stage'))}); lenis.on('scroll',e=>{ scrollVel=e.velocity||0; }); (function raf(t){ lenis.raf(t); requestAnimationFrame(raf); })(performance.now()); }
function scrollToSel(s){ const el=$(s); if(!el) return; lenis? lenis.scrollTo(el,{duration:1.6}) : el.scrollIntoView({behavior:'smooth'}); }
$$('[data-scroll]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); scrollToSel(a.dataset.scroll); }));

applyLang();
requestAnimationFrame(frame);

/* ---------- intro: counter (first visit only), then the ring assembles ---------- */
let SEEN=false; try{ SEEN=sessionStorage.getItem('df-seen')==='1'; sessionStorage.setItem('df-seen','1'); }catch(e){}
function reveal(){
  $('#loader').classList.add('open'); document.body.classList.remove('loading');
  setTimeout(()=>$('#hello').classList.remove('pre-chars'),300);
  plates.forEach((p,i)=>{ p.style.transitionDelay=(.4+i*.035)+'s'; });
  setTimeout(()=>world.classList.remove('pre'),200);
  setTimeout(()=>{ $('#loader').style.display='none'; plates.forEach(p=>p.style.transitionDelay=''); },2400);
  if(TOUCH) setTimeout(()=>{ if(!started) begin(); },2200);
  if(location.hash && $(location.hash) && location.hash.length>3) setTimeout(()=>scrollToSel(location.hash),300);
}
if(RM || SEEN){ $('#count').parentElement.style.display='none'; reveal(); }
else { const t0=performance.now(), D=1500; (function c(t){ const p=clamp((t-t0)/D,0,1), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  $('#count').textContent=String(Math.round(e*100)).padStart(3,'0'); $('#bar').style.transform=`scaleX(${e})`;
  if(p<1) requestAnimationFrame(c); else setTimeout(reveal,150); })(t0); }
})();
</script>
</body>
</html>
